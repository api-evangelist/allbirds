aid: allbirds
name: Allbirds
description: >-
  Allbirds is a sustainability-focused footwear and apparel brand known for its
  wool and tree-fiber shoes, selling direct-to-consumer through its Shopify-powered
  online store at allbirds.com. It was surfaced as a portfolio company of Addition
  and added to the API Evangelist network. While Allbirds publishes no traditional
  developer program, its storefront exposes a real agent-commerce surface: a live
  Shopify Universal Commerce Protocol (UCP) MCP server for catalog search, cart,
  and checkout; OpenID Connect / OAuth 2.0 Customer Accounts authentication; and an
  /llms.txt agent-instructions document. This profile captures that agent-native
  commerce and authentication surface.
